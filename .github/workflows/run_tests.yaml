on:
  pull_request:
  push:
    branches: [ main ]
  workflow_call:

jobs:
  cpu_unit_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9]
    steps:
      - name: Check out repo
        uses: actions/checkout@v2
      - name: Setup conda env
        uses: conda-incubator/setup-miniconda@v2
        with:
          miniconda-version: "latest"
          activate-environment: test
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          set -eux
          conda activate test
          conda install pytorch cpuonly -c pytorch-nightly
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          pip install --no-build-isolation -e ".[dev]"
      - name: Run unit tests with coverage
        shell: bash -l {0}
        run: |
          set -eux
          conda activate test
          pytest --timeout=300 --cov=. --cov-report xml -vv -rA -m "not gpu_only" tests
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v2

  gpu_unit_tests:
    runs-on: ${{ matrix.os }}
    container:
      image: pytorch/almalinux-builder:cuda12.8
      options: --gpus all
    strategy:
      matrix:
        os: [mt-l-x86iavx512-29-115-t4]
        python-version: [3.8]
        cuda-tag: ["cu11"]
    steps:
      - name: Check out repo
        uses: actions/checkout@v2
      - name: Setup conda env
        uses: conda-incubator/setup-miniconda@v2
        with:
          miniconda-version: "latest"
          activate-environment: test
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash -l {0}
        run: |
          set -eux
          conda activate test
          conda install pytorch pytorch-cuda=11.8 -c pytorch-nightly -c nvidia
          pip install torchrec-nightly

          # Use stable fbgemm-gpu
          # pip uninstall -y fbgemm-gpu-nightly
          # pip install fbgemm-gpu-nightly

          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          pip install --no-build-isolation -e ".[dev]"
      - name: Run unit tests with coverage
        shell: bash -l {0}
        run: |
          set -eux
          conda activate test
          pytest --timeout=60 --cov=. --cov-report xml -vv -rA -m "gpu_only or cpu_and_gpu" tests
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v2

